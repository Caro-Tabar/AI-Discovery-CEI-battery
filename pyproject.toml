[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cei-scout"
version = "0.1.0"
description = "Physics-informed active learning for screening non-fluorinated sulfur additives in high-voltage LNMO electrolytes."
authors = [
    { name = "Caro Tabar", email = "Caro.m.tabar@gmail.com" },
]
requires-python = ">=3.11"
